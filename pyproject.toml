[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cp2graph"
version = "0.1.0"
description = "Convert CP models (FlatZinc / MiniZinc compiled IR) to bipartite mathematical constraint graphs."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "cp2graph contributors" }]
dependencies = [
  "networkx>=3.2",
  "lark>=1.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
cp2graph = "cp2graph.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=cp2graph --cov-report=term-missing --cov-branch"
